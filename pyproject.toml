[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afc-robustness-benchmark"
version = "0.1.0"
description = "Perturbation-based robustness benchmarking for online alarm flood classification."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "AFC Robustness Authors"}
]
keywords = ["alarm-flood-classification", "robustness", "industrial-ai", "event-streams"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "scipy>=1.9",
  "pyyaml>=6.0",
  "joblib>=1.2",
  "tqdm>=4.64",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "black>=24.0",
  "ipykernel>=6.0",
  "nbformat>=5.7"
]
casim = [
  "sktime>=0.26",
  "numba>=0.57"
]

[project.scripts]
afc-benchmark = "afc_robustness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

target-version = ["py310"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
